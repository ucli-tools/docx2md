name: Trigger Registry Update

# Sends tool-updated to ucli-registry. It runs only after the test job passes.

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run tests
        run: python -m pytest tests/ -q

  trigger-registry-update:
    name: Trigger registry update (tested)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Trigger ucli-registry update
        env:
          UCLI_REGISTRY_UPDATE_TOKEN: ${{ secrets.UCLI_REGISTRY_UPDATE_TOKEN }}
          TESTED: "true"
          TOOL_SHA: ${{ github.sha }}
        run: |
          echo "Triggering registry update for ${GITHUB_REPOSITORY} (tested=${TESTED})..."

          if [[ -z "${UCLI_REGISTRY_UPDATE_TOKEN}" ]]; then
            echo "Error: UCLI_REGISTRY_UPDATE_TOKEN secret not found"
            exit 1
          fi

          # "tool" keeps its current value (owner/repo); "name", "sha" and "tested"
          # are additive, so the registry can re-pin only this tool and flag untested ones.
          payload="{\"event_type\": \"tool-updated\", \"client_payload\": {\"tool\": \"${GITHUB_REPOSITORY}\", \"name\": \"${GITHUB_REPOSITORY#*/}\", \"sha\": \"${TOOL_SHA}\", \"tested\": ${TESTED}}}"

          response=$(curl -s -w "%{http_code}" -X POST \
            -H "Authorization: token ${UCLI_REGISTRY_UPDATE_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/ucli-tools/ucli-registry/dispatches \
            -d "${payload}")

          http_code="${response: -3}"
          response_body="${response:0:${#response}-3}"

          if [[ "$http_code" == "204" ]]; then
            echo "Successfully triggered registry update"
            echo "Repository: ${GITHUB_REPOSITORY}"
          else
            echo "Failed to trigger registry update"
            echo "HTTP Code: $http_code"
            echo "Response: $response_body"
            exit 1
          fi

